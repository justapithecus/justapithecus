name: 🔄 Update releases
run-name: Refresh latest releases in the profile README

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/update-releases.sh
      - .github/workflows/update-releases.yml

concurrency:
  group: update-releases
  cancel-in-progress: false

jobs:
  update:
    name: 🔄 Update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔄 Rewrite the releases block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNERS: pithecene
        run: .github/scripts/update-releases.sh

      - name: 📤 Commit when it changed
        run: |
          if git diff --quiet README.md; then
            echo "releases unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore(profile): 🍱 refresh recent releases'
          git push
